{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>Add Quote</title>

<link rel="stylesheet"
href="{% static 'css/style.css' %}">

</head>

<body>

<div class="form-page">

<div class="form-card">

<h1>Add New Quote</h1>

<form method="POST">

{% csrf_token %}

<textarea
name="text"
rows="5"
placeholder="Enter Quote"
required>
</textarea>

<input
type="text"
name="author"
placeholder="Author Name"
required>

<button type="submit">

Save Quote

</button>

</form>

<a href="/"
class="back-btn">
